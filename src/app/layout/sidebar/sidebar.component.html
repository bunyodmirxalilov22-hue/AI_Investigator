<aside
  class="hidden h-screen w-[15.5rem] shrink-0 flex-col border-r border-slate-200/80 bg-white lg:flex dark:border-white/[0.07] dark:bg-slate-950">
  <!-- Brand -->
  <div class="px-[1.125rem] pb-[1.25rem] pt-[1.375rem]">
    <a routerLink="/app/dashboard" class="group flex items-center gap-[0.7rem] rounded-xl">
      <!-- Logo -->
      <div
        class="grid h-[2.375rem] w-[2.375rem] shrink-0 place-items-center rounded-[0.8rem] bg-slate-950 shadow-sm transition-all duration-200 group-hover:scale-[1.035] group-hover:shadow-md dark:bg-white">
        <img src="assets/logo-mark.png" alt="Investigator" class="h-[1.45rem] w-[1.45rem] object-contain dark:invert" />
      </div>

      <!-- Brand text -->
      <div class="min-w-0">
        <p
          class="truncate text-[0.9rem] font-semibold leading-tight tracking-[-0.025em] text-slate-950 dark:text-white">
          Investigator
        </p>

        <p
          class="mt-[0.2rem] text-[0.62rem] font-semibold uppercase leading-none tracking-[0.14em] text-slate-400 dark:text-slate-500">
          AI Research
        </p>
      </div>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-[0.7rem]">
    <p
      class="mb-[0.45rem] px-[0.75rem] text-[0.625rem] font-semibold uppercase tracking-[0.14em] text-slate-400 dark:text-slate-600">
      Workspace
    </p>

    <div class="space-y-[0.2rem]">
      @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="bg-slate-100 text-slate-950 dark:bg-white/[0.07] dark:text-white"
        [routerLinkActiveOptions]="{ exact: false }"
        class="group relative flex items-center gap-[0.7rem] rounded-[0.7rem] px-[0.7rem] py-[0.6rem] text-[0.8125rem] font-medium text-slate-500 transition-all duration-150 hover:bg-slate-50 hover:text-slate-950 dark:text-slate-400 dark:hover:bg-white/[0.04] dark:hover:text-white">
        <!-- Active indicator -->
        <span
          class="absolute left-0 top-1/2 h-[1.25rem] w-[0.1875rem] -translate-y-1/2 rounded-r-full bg-blue-600 opacity-0 transition-opacity group-[.router-link-active]:opacity-100 dark:bg-blue-400"></span>

        <!-- Icon -->
        <span
          class="grid h-[2rem] w-[2rem] shrink-0 place-items-center rounded-[0.6rem] text-slate-400 transition-colors group-hover:text-slate-700 dark:text-slate-500 dark:group-hover:text-slate-200"
          [innerHTML]="item.icon"></span>

        <!-- Label -->
        <span class="truncate">
          {{ item.label }}
        </span>
      </a>
      }
    </div>
  </nav>

  <!-- Bottom -->
  <div class="px-[0.7rem] pb-[0.9rem]">

    <!-- AI Status -->
    <div
      class="mb-[0.65rem] overflow-hidden rounded-[0.7rem] border border-slate-200/80 bg-slate-50 p-[0.7rem] dark:border-white/[0.07] dark:bg-white/[0.03]">
      <div class="flex items-center gap-[0.6rem]">

        <div
          class="grid h-[1.75rem] w-[1.75rem] shrink-0 place-items-center rounded-[0.55rem] bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 14 9l7 3-7 3-2 7-2-7-7-3 7-3 2-7Z" fill="currentColor" />
          </svg>
        </div>

        <div class="min-w-0">
          <p class="text-[0.8rem] font-semibold leading-tight text-slate-700 dark:text-slate-200">
            AI Investigator
          </p>

          <p class="mt-[0.2rem] truncate text-[0.625rem] text-slate-400 dark:text-slate-500">
            Ready for analysis
          </p>
        </div>

        <span
          class="ml-auto h-[0.375rem] w-[0.375rem] shrink-0 rounded-full bg-emerald-500 shadow-[0_0_0_0.1875rem_rgba(16,185,129,0.10)]"></span>
      </div>
    </div>

    <!-- Profile -->
    <a routerLink="/app/profile"
      class="group flex items-center gap-[0.7rem] rounded-[0.7rem] border border-transparent px-[0.6rem] py-[0.6rem] transition-all duration-150 hover:border-slate-200 hover:bg-slate-50 dark:hover:border-white/[0.07] dark:hover:bg-white/[0.04]">
      <!-- Avatar -->
      <div
        class="grid h-[2.25rem] w-[2.25rem] shrink-0 place-items-center rounded-full bg-gradient-to-br from-blue-500 to-blue-700 text-[0.6875rem] font-semibold text-white shadow-sm">
        AM
      </div>

      <!-- User info -->
      <div class="min-w-0 flex-1">
        <p class="truncate text-[0.75rem] font-semibold leading-tight text-slate-900 dark:text-white">
          Alex Morgan
        </p>

        <p class="mt-[0.2rem] truncate text-[0.625rem] leading-tight text-slate-400 dark:text-slate-500">
          alex&#64;example.com
        </p>
      </div>

      <!-- Arrow -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
        class="shrink-0 text-slate-300 transition-all duration-150 group-hover:translate-x-[0.125rem] group-hover:text-slate-500 dark:text-slate-600 dark:group-hover:text-slate-300">
        <path d="M5 12h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />

        <path d="m13 6 6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </a>

  </div>
</aside>
