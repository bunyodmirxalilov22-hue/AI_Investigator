<aside class="hidden h-screen w-60 shrink-0 flex-col border-r border-[var(--border-subtle)] bg-[var(--surface-1)] lg:flex">
  <a routerLink="/app/dashboard" class="flex items-center gap-2 px-6 py-5">
    <img src="assets/logo-mark.png" alt="Investigator" class="h-8 w-8 object-contain" />
    <span class="text-[15px] font-semibold tracking-tight">Investigator</span>
  </a>

  <nav class="flex-1 space-y-1 px-3">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-[var(--surface-2)] text-[var(--text-primary)]"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-[var(--text-secondary)] transition-colors hover:bg-[var(--surface-2)] hover:text-[var(--text-primary)]"
      >
        <span class="shrink-0" [innerHTML]="item.icon"></span>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="border-t border-[var(--border-subtle)] p-3">
    <a routerLink="/app/profile" class="flex items-center gap-3 rounded-lg px-3 py-2.5 transition-colors hover:bg-[var(--surface-2)]">
      <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-accent-500 text-xs font-semibold text-white">AM</span>
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-medium text-[var(--text-primary)]">Alex Morgan</p>
        <p class="truncate text-xs text-[var(--text-tertiary)]">alex&#64;example.com</p>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-[var(--text-tertiary)]"><path d="M4 12h13.2M12.5 6.5 18 12l-5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</aside>
