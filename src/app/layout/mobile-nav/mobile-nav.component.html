<nav class="fixed inset-x-0 bottom-0 z-40 flex items-center justify-around border-t border-[var(--border-subtle)] bg-[var(--surface-0)]/95 py-2 backdrop-blur-md lg:hidden">
  @for (item of items; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="text-accent-500"
      class="flex flex-col items-center gap-1 px-3 py-1 text-[var(--text-tertiary)] transition-colors"
    >
      <span [innerHTML]="item.icon"></span>
      <span class="text-[10px] font-medium">{{ item.label }}</span>
    </a>
  }
</nav>
