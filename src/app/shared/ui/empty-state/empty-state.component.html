<div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-[var(--border-default)] px-6 py-16 text-center">
  <div class="grid h-12 w-12 place-items-center rounded-full bg-[var(--surface-2)] text-[var(--text-tertiary)]" [innerHTML]="icon"></div>
  <h3 class="mt-4 text-sm font-semibold text-[var(--text-primary)]">{{ title }}</h3>
  <p class="text-body mt-1.5 max-w-xs text-[13.5px]">{{ description }}</p>
  <div class="mt-5">
    <ng-content />
  </div>
</div>
