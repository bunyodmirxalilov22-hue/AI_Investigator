<span class="inline-flex items-center gap-1.5">
  <span class="text-amber-500 text-sm tracking-tight">
    @for (i of stars; track i) {
      <span>{{ i <= Math.round(value) ? '★' : '☆' }}</span>
    }
  </span>
  <span class="text-data text-sm" style="color: var(--text-primary)">{{ value.toFixed(1) }}</span>
  @if (count) {
    <span class="text-caption">({{ countLabel }})</span>
  }
</span>
