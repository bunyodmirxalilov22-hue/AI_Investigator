<div class="mt-1 s
">

  <div class="flex items-center justify-between">

    <div>
      <h2
        class="text-base font-semibold tracking-tight text-slate-950 dark:text-white"
      >
        Recent investigations
      </h2>

      <p
        class="mt-1 text-xs text-slate-500 dark:text-slate-400"
      >
        Your latest product research
      </p>
    </div>

    <a
      routerLink="/app/investigations"
      class="rounded-lg px-2.5 py-1.5 text-xs font-semibold text-blue-600 transition-colors hover:bg-blue-50 dark:text-blue-400 dark:hover:bg-blue-500/10"
    >
      View all
    </a>

  </div>


  <div class="mt-4 space-y-3">

    @for (item of investigations; track item.id) {

      <a
        [routerLink]="['/app/investigations', item.id]"
        class="block transition-transform duration-200 hover:-translate-y-0.5"
      >
        <ui-investigation-card
          [investigation]="item"
        />
      </a>

    }

  </div>

</div>
