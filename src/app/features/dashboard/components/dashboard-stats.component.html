<div class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">

  <div
    class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm shadow-slate-950/[0.02] dark:border-white/[0.07] dark:bg-white/[0.03] dark:shadow-none">
    <p class="text-xs font-medium text-slate-500 dark:text-slate-400">
      Total investigations
    </p>

    <p class="mt-3 text-2xl font-semibold tracking-tight text-slate-950 dark:text-white">
      {{ stats.total }}
    </p>
  </div>


  <div
    class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm shadow-slate-950/[0.02] dark:border-white/[0.07] dark:bg-white/[0.03] dark:shadow-none">
    <p class="text-xs font-medium text-slate-500 dark:text-slate-400">
      Completed
    </p>

    <p class="mt-3 text-2xl font-semibold tracking-tight text-slate-950 dark:text-white">
      {{ stats.completed }}
    </p>
  </div>


  <div
    class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm shadow-slate-950/[0.02] dark:border-white/[0.07] dark:bg-white/[0.03] dark:shadow-none">
    <p class="text-xs font-medium text-slate-500 dark:text-slate-400">
      Average AI score
    </p>

    <div class="mt-3 flex items-baseline gap-1">
      <p class="text-2xl font-semibold tracking-tight text-slate-950 dark:text-white">
        {{ stats.averageScore }}
      </p>

      <span class="text-xs text-slate-400 dark:text-slate-500">
        /100
      </span>
    </div>
  </div>


  <div
    class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm shadow-slate-950/[0.02] dark:border-white/[0.07] dark:bg-white/[0.03] dark:shadow-none">
    <p class="text-xs font-medium text-slate-500 dark:text-slate-400">
      Saved products
    </p>

    <p class="mt-3 text-2xl font-semibold tracking-tight text-slate-950 dark:text-white">
      {{ stats.saved }}
    </p>
  </div>

</div>
