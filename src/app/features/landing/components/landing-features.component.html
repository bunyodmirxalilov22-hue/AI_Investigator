<section
  id="features"
  class="border-b border-slate-200/70 py-24 sm:py-28 dark:border-white/[0.06]"
>
  <div class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <span
        class="text-[11px] font-semibold uppercase tracking-[0.16em] text-blue-600 dark:text-blue-400"
      >
        Product intelligence
      </span>

      <h2
        class="mt-4 text-3xl font-semibold tracking-[-0.04em] text-slate-950 sm:text-4xl dark:text-white"
      >
        Everything that matters
        <span class="text-slate-400 dark:text-slate-500">
          before checkout.
        </span>
      </h2>
    </div>

    <div class="mt-14 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      @for (f of features; track f.title; let i = $index) {
        <div
          class="group rounded-2xl border border-slate-200 bg-white p-7 transition duration-300 hover:-translate-y-1 hover:border-slate-300 hover:shadow-xl hover:shadow-slate-200/40 dark:border-white/[0.08] dark:bg-slate-900 dark:hover:border-white/[0.14] dark:hover:shadow-black/20"
        >
          <div
            class="grid h-10 w-10 place-items-center rounded-xl border border-blue-100 bg-blue-50 text-blue-600 dark:border-blue-400/10 dark:bg-blue-400/[0.08] dark:text-blue-400"
            [innerHTML]="f.icon"
          ></div>

          <h3
            class="mt-6 text-[15px] font-semibold tracking-tight text-slate-950 dark:text-white"
          >
            {{ f.title }}
          </h3>

          <p
            class="mt-2 text-[13px] leading-6 text-slate-500 dark:text-slate-400"
          >
            {{ f.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
