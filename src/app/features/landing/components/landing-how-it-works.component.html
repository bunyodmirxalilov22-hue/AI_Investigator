<section
  id="how-it-works"
  class="border-b border-slate-200/70 py-24 sm:py-28 dark:border-white/[0.06]"
>
  <div class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <span
        class="text-[11px] font-semibold uppercase tracking-[0.16em] text-blue-600 dark:text-blue-400"
      >
        How it works
      </span>

      <h2
        class="mt-4 text-3xl font-semibold tracking-[-0.04em] text-slate-950 sm:text-4xl dark:text-white"
      >
        Three steps.
        <span class="text-slate-400 dark:text-slate-500">
          One clear answer.
        </span>
      </h2>
    </div>

    <div
      class="mt-14 grid overflow-hidden rounded-2xl border border-slate-200 md:grid-cols-3 dark:border-white/[0.08]"
    >
      @for (step of steps; track step.title; let i = $index) {
        <div
          class="group border-b border-slate-200 p-7 last:border-b-0 md:border-b-0 md:border-r md:last:border-r-0 md:p-9 dark:border-white/[0.08]"
        >
          <span
            class="text-xs font-semibold tracking-[0.15em] text-slate-300 dark:text-slate-600"
          >
            0{{ i + 1 }}
          </span>

          <h3
            class="mt-10 text-lg font-semibold tracking-tight text-slate-950 dark:text-white"
          >
            {{ step.title }}
          </h3>

          <p
            class="mt-3 text-sm leading-6 text-slate-500 dark:text-slate-400"
          >
            {{ step.description }}
          </p>

          <div
            class="mt-8 h-px w-10 bg-slate-200 transition-all duration-300 group-hover:w-16 group-hover:bg-blue-500 dark:bg-white/10"
          ></div>
        </div>
      }
    </div>
  </div>
</section>
