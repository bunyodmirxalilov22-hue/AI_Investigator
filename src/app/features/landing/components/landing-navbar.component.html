<header
  class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/80 backdrop-blur-xl dark:border-white/[0.07] dark:bg-slate-950/80"
>
  <div
    class="mx-auto flex h-[3.875rem] max-w-7xl items-center justify-between px-5 sm:px-6 lg:px-8"
  >
    <!-- Logo -->
    <a routerLink="/" class="group flex items-center gap-2.5">
      <div
        class="grid h-9 w-9 place-items-center rounded-xl border border-slate-200 bg-white shadow-sm transition-transform duration-200 group-hover:scale-105 dark:border-white/10 dark:bg-white/[0.06]"
      >
        <img
          src="assets/logo-mark.png"
          alt="Investigator"
          class="h-6 w-6 object-contain"
        />
      </div>

      <span
        class="text-[0.9375rem] font-semibold tracking-[-0.02em] text-slate-950 dark:text-white"
      >
        Investigator
      </span>
    </a>

    <!-- Navigation -->
    <nav class="hidden items-center gap-8 md:flex">
      <a
        href="#product"
        class="text-[13px] font-medium text-slate-500 transition-colors hover:text-slate-950 dark:text-slate-400 dark:hover:text-white"
      >
        Product
      </a>

      <a
        href="#how-it-works"
        class="text-[13px] font-medium text-slate-500 transition-colors hover:text-slate-950 dark:text-slate-400 dark:hover:text-white"
      >
        How it works
      </a>

      <a
        href="#features"
        class="text-[13px] font-medium text-slate-500 transition-colors hover:text-slate-950 dark:text-slate-400 dark:hover:text-white"
      >
        Features
      </a>

      <a
        href="#trust"
        class="text-[13px] font-medium text-slate-500 transition-colors hover:text-slate-950 dark:text-slate-400 dark:hover:text-white"
      >
        Trust
      </a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="toggleTheme()"
        aria-label="Toggle theme"
        class="grid h-9 w-9 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-400 dark:hover:bg-white/[0.06] dark:hover:text-white"
      >
        @if (isDark()) {
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="4.5"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path
              d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>

      <a
        routerLink="/auth/login"
        class="hidden px-3 text-[13px] font-medium text-slate-600 transition hover:text-slate-950 sm:block dark:text-slate-300 dark:hover:text-white"
      >
        Log in
      </a>

      <ui-button size="sm" routerLink="/auth/register">
        Start investigating
      </ui-button>
    </div>
  </div>
</header>
