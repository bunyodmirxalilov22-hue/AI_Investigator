<section
  id="trust"
  class="border-b border-slate-200/70 py-24 sm:py-28 dark:border-white/[0.06]"
>
  <div class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">
    <div class="max-w-2xl">
      <span
        class="text-sm font-semibold uppercase tracking-[0.16em] text-blue-600 dark:text-blue-400"
      >
        Trust
      </span>

      <h2
        class="mt-4 text-3xl font-semibold tracking-[-0.04em] text-slate-950 sm:text-4xl dark:text-white"
      >
        A recommendation you can
        <span class="text-slate-400 dark:text-slate-500">
          actually understand.
        </span>
      </h2>
    </div>

    <div class="mt-14 grid gap-4 md:grid-cols-3">
      @for (item of pillars; track item.title) {
        <div
          class="rounded-2xl border border-slate-200 bg-white p-7 dark:border-white/[0.08] dark:bg-slate-900"
        >
          <p
            class="text-3xl font-semibold tracking-[-0.04em] text-slate-950 dark:text-white"
          >
            {{ item.stat }}
          </p>

          <h3
            class="mt-5 text-sm font-semibold text-slate-950 dark:text-white"
          >
            {{ item.title }}
          </h3>

          <p
            class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400"
          >
            {{ item.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
